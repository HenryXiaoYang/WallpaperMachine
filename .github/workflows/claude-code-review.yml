name: Claude Code Review

# Same-repo PRs are reviewed automatically. Fork PRs get no secrets or OIDC on
# `pull_request`, so a maintainer opts them in by adding the `claude-review`
# label: `pull_request_target` runs with this repo's secrets, and the labeler
# (not the fork author) passes the action's write-access check. Claude only
# gets the inline-comment tool, so nothing from the PR is executed. Never add a
# checkout of the PR head here. See the action's docs/security.md.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  pull_request_target:
    types: [labeled]

jobs:
  claude-review:
    if: |
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' &&
        github.event.label.name == 'claude-review')

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write only so the last step can remove the label for re-runs
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # Removing the label lets a maintainer re-add it to review new commits.
      - name: Remove review label
        if: always() && github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --remove-label claude-review
